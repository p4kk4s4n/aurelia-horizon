<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aurelia Horizon — Automated Unit Tests</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/three.module.js",
        "three/addons/": "../vendor/three/",
        "three/utils/": "../vendor/utils/"
      }
    }
  </script>
  <style>
    body { background: #0b132b; color: #e0fbfc; font-family: monospace; padding: 24px; }
    .pass { color: #00f5d4; }
    .fail { color: #ff595e; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Aurelia Horizon — Core Mechanics Test Suite</h2>
  <pre id="test-output">Running tests...</pre>

  <script>
    window.onerror = function(msg, url, line, col, err) {
      document.getElementById('test-output').textContent += '\n\nGLOBAL ERROR: ' + msg + ' at ' + url + ':' + line + ':' + col + '\n' + (err ? err.stack : '');
    };
    window.onunhandledrejection = function(e) {
      document.getElementById('test-output').textContent += '\n\nPROMISE REJECTION: ' + (e.reason ? (e.reason.stack || e.reason) : e);
    };
  </script>

  <script type="module">
    import { SeededNoise } from '../src/world/noise.js';
    import { cubeToSphere, buildCubeSphereData, createCubeSphereMesh } from '../src/world/cubeSphere.js';
    import { evaluateGravity } from '../src/world/gravity.js';
    import { ShipRepairSystem, SHIP_PART_DEFS } from '../src/ship/repair.js';
    import { UI_COLOR_SCHEMES, SettingsManager, APP_VERSION, compareSemver, extractVersionFromCommitMessage } from '../src/ui/settings.js';
    import { InputManager, DEFAULT_KEYBINDINGS } from '../src/input.js';
    import { TouchControlsManager } from '../src/ui/touchControls.js';
    import { Explorer } from '../src/player/explorer.js';
    import { Ship } from '../src/ship/ship.js';
    import { mulberry32, bezierSpine, tubeAlongSpine, shardGeometry } from '../src/world/procGeo.js';
    import { createSolarSystem } from '../src/world/body.js';
    import { createDeepOceanMesh } from '../src/world/ocean.js';
    import { NavMarkerSystem } from '../src/ui/navMarkers.js';
    import { MineralDeposit, MineralSystem } from '../src/world/minerals.js';
    import {
      FloraCollisionGrid,
      createLucentMycenaVariants,
      createPrismaticLithocactusVariants,
      createCyanSerrataFernVariants,
      createCobaltStrataArborVariants,
      createAbyssalTendrilPodVariants
    } from '../src/world/decor.js';
    import { FAUNA_SPECIES, FaunaEntity, FaunaSystem } from '../src/world/fauna.js';
    import { CameraRig } from '../src/player/cameraRig.js';
    import { ObjectiveSystem, ACHIEVEMENTS, STORAGE_CAMPAIGN_KEY } from '../src/world/objectives.js';
    import { InventoryModal, CRAFTING_RECIPES } from '../src/ui/inventoryModal.js';
    import { EnemyFactionSystem, EnemyPodShip, BugAlienTrooper, EnemyOutpostBase } from '../src/world/enemyFaction.js';
    import { StoryDialogSystem } from '../src/ui/storyDialog.js';
    import { CompletionModal } from '../src/ui/completionModal.js';
    import { HUD } from '../src/ui/hud.js';
    import {
      createBasaltNormalMap,
      createCarbonFiberNormalMap,
      createMetalPanelsNormalMap,
      createWaterNormalMap,
      createNoiseRoughnessMap,
      createGrassTexture,
      createGrassNormalMap,
      createRockTexture,
      createRockNormalMap,
      createTerrainRoughnessMap
    } from '../src/world/procTextures.js';
    import { PostProcessingManager } from '../src/world/postprocessing.js';
    import { createSkyAndSpaceTargets } from '../src/world/sky.js';
    import * as THREE from 'three';

    const logs = [];
    let passed = 0;
    let failed = 0;

    function assert(condition, name) {
      if (condition) {
        passed++;
        logs.push(`PASS: ${name}`);
      } else {
        failed++;
        logs.push(`FAIL: ${name}`);
      }
    }

    // 1. SeededNoise determinism & range
    const n1 = new SeededNoise(1042);
    const n2 = new SeededNoise(1042);
    const v1 = n1.fbm(0.4, 0.7, -0.2, 4);
    const v2 = n2.fbm(0.4, 0.7, -0.2, 4);
    assert(Math.abs(v1 - v2) < 1e-9, 'SeededNoise fBm is deterministic for identical seeds');
    assert(v1 >= -1 && v1 <= 1, 'SeededNoise fBm output is within [-1, 1]');

    // 2. Cube-sphere projection & geometry data
    const [sx, sy, sz] = cubeToSphere(1, 1, 1);
    const unitLen = Math.hypot(sx, sy, sz);
    assert(Math.abs(unitLen - 1.0) < 1e-6, 'cubeToSphere projects cube corners onto unit sphere');

    const seg = 8;
    const sphereData = buildCubeSphereData({
      segments: seg,
      heightSampler: () => 360,
      colorSampler: () => [0.2, 0.8, 0.5]
    });
    assert(sphereData.totalVerts === 6 * (seg + 1) * (seg + 1), 'buildCubeSphereData produces 6*(N+1)^2 vertices');
    assert(sphereData.totalIndices === 6 * seg * seg * 6, 'buildCubeSphereData produces 36*N^2 triangle indices');

    // 3. Spherical gravity & dominant body switching (Planet + 3 Moons of varying size)
    const mockBodies = [
      {
        id: 'aurelia',
        radius: 360,
        surfaceGravity: 26,
        soiRadius: 1150,
        isMoon: false,
        getWorldPosition: () => new THREE.Vector3(0, 0, 0),
        getSurfaceRadiusAtDir: () => 360
      },
      {
        id: 'lumen',
        radius: 65,
        surfaceGravity: 9.5,
        soiRadius: 230,
        isMoon: true,
        getWorldPosition: () => new THREE.Vector3(980, 0, 0),
        getSurfaceRadiusAtDir: () => 65
      }
    ];

    const gPlanet = evaluateGravity({ x: 0, y: 370, z: 0 }, mockBodies);
    assert(gPlanet.body.id === 'aurelia', 'Dominant body near planet surface is Aurelia Prime');
    assert(Math.abs(gPlanet.altitude - 10) < 1e-3, 'Altitude above planet surface is accurate');
    assert(gPlanet.up.y > 0.99 && gPlanet.acceleration.y < 0, 'Spherical gravity pulls toward planet center');

    const gMoon = evaluateGravity({ x: 980, y: 75, z: 0 }, mockBodies);
    assert(gMoon.body.id === 'lumen', 'Dominant body switches to Moon I (Lumen) inside moon SOI');
    assert(Math.abs(gMoon.altitude - 10) < 1e-3, 'Altitude above moon surface is accurate');

    // 4. Ship repair & part installation loop
    const repair = new ShipRepairSystem(null, null);
    repair.parts = SHIP_PART_DEFS.map((d) => ({ ...d, collected: false, installed: false }));
    assert(!repair.isShipRepaired(), 'Ship starts damaged (0/5 parts installed)');

    repair.tryPickupPart(repair.parts[0]);
    assert(repair.getStatus().carried === 1 && repair.getStatus().collected === 1, 'Picking up a part increments carried & collected count');

    repair.installCarriedParts();
    assert(repair.getStatus().installed === 1 && repair.getStatus().carried === 0, 'Installing carried parts transfers them to installed');

    repair.giveAndInstallAll();
    assert(repair.isShipRepaired() && repair.getStatus().installed === 5, 'Ship becomes repaired when all 5 parts are installed');

    // 5. WebAPK / PWA Manifest unique identity and raster icons check
    const manifestResp = await fetch('../manifest.webmanifest');
    const manifest = await manifestResp.json();
    assert(manifest.id === '/aurelia-horizon/', 'WebAPK manifest id is uniquely scoped to /aurelia-horizon/');
    assert(manifest.scope === './' && manifest.start_url === './?source=pwa', 'WebAPK manifest scope and start_url are scoped to repo path with distinct parameter');
    assert(
      manifest.icons.some(i => i.sizes === '192x192' && i.type === 'image/png') &&
      manifest.icons.some(i => i.sizes === '512x512' && i.type === 'image/png'),
      'WebAPK manifest includes raster PNG icons (192 and 512) required for Google minting server'
    );

    // 6. Settings UI Color Schemes & version.json check
    assert(Object.keys(UI_COLOR_SCHEMES).length >= 5, 'UI_COLOR_SCHEMES provides at least 5 color palettes');
    const verResp = await fetch('../version.json');
    const verJson = await verResp.json();
    assert(verJson.repo === 'p4kk4s4n/aurelia-horizon' && Boolean(verJson.version), 'version.json tracks p4kk4s4n/aurelia-horizon version');

    // 7. InputManager & Touch Controls
    const mockCanvas = document.createElement('canvas');
    const testInput = new InputManager(mockCanvas);
    testInput.setVirtualKey('Space', true);
    assert(testInput.isDown('Space') && testInput.wasPressed('Space'), 'setVirtualKey marks key down and pressed');
    testInput.endFrame();
    assert(testInput.isDown('Space') && !testInput.wasPressed('Space'), 'endFrame resets wasPressed while keeping isDown');
    testInput.setVirtualKey('Space', false);
    assert(!testInput.isDown('Space'), 'releasing virtual key unsets isDown');

    testInput.addTouchLookDelta(10, -5);
    const lookFrame = testInput.consumeFrame();
    assert(lookFrame.dx === 10 && lookFrame.dy === -5, 'addTouchLookDelta provides delta in consumeFrame');

    // Test TouchControlsManager
    const touchOverlay = document.createElement('div');
    touchOverlay.id = 'touch-controls';
    document.body.appendChild(touchOverlay);

    const touchMgr = new TouchControlsManager(testInput);
    assert(['dual-sticks', 'floating-look', 'dpad-look'].includes(touchMgr.scheme), 'TouchControls initializes valid scheme');
    touchMgr.applyScheme('floating-look');
    assert(touchMgr.scheme === 'floating-look', 'applyScheme switches to floating-look');
    touchMgr.applyScheme('dpad-look');
    assert(touchMgr.scheme === 'dpad-look', 'applyScheme switches to dpad-look');
    touchMgr.applyScheme('dual-sticks');
    assert(touchMgr.scheme === 'dual-sticks', 'applyScheme switches to dual-sticks');

    touchMgr.setSensitivity(1.5);
    assert(testInput.touchLookSensitivity === 1.5, 'setSensitivity updates input look sensitivity');

    touchMgr.applyVisibility('always');
    assert(touchOverlay.classList.contains('visible'), 'applyVisibility always shows touch overlay');
    touchMgr.applyVisibility('hidden');
    assert(!touchOverlay.classList.contains('visible'), 'applyVisibility hidden hides touch overlay');

    // 8. Character Model Structure, Scalable Polygon Density & Articulated Limbs
    const mockScene = new THREE.Scene();
    const testExplorer = new Explorer(mockScene);
    assert(Boolean(testExplorer.torso), 'Explorer has sculpted torso');
    assert(Boolean(testExplorer.head), 'Explorer has helmet and crown crest');
    assert(Boolean(testExplorer.crystalCore), 'Explorer has hexagonal crystal power core');
    assert(Boolean(testExplorer.companionDrone), 'Explorer has floating companion drone');
    assert(Boolean(testExplorer.leftArm && testExplorer.rightArm), 'Explorer has articulated left and right arms');
    assert(Boolean(testExplorer.leftLeg && testExplorer.rightLeg), 'Explorer has articulated left and right legs');
    assert(Boolean(testExplorer.leftForearmGroup && testExplorer.rightForearmGroup), 'Explorer has articulated elbow joints (left and right forearms)');
    assert(Boolean(testExplorer.leftLowerLegGroup && testExplorer.rightLowerLegGroup), 'Explorer has articulated knee joints (left and right lower legs)');
    assert(Boolean(testExplorer.jetFlameLeft && testExplorer.jetFlameRight), 'Explorer has dual jetpack boost thrusters');

    // Scalable Polygon Count Density
    testExplorer.setPolygonDensity('low');
    const lowPoly = testExplorer.getPolygonCount();
    testExplorer.setPolygonDensity('high');
    const highPoly = testExplorer.getPolygonCount();
    testExplorer.setPolygonDensity('ultra');
    const ultraPoly = testExplorer.getPolygonCount();
    assert(highPoly.vertices >= lowPoly.vertices * 2.5, 'High density character model has >= 2.5x the vertex density of baseline low-poly');
    assert(ultraPoly.vertices > highPoly.vertices, 'Ultra density character model scales vertex count higher than high density');
    testExplorer.setPolygonDensity('high'); // restore default

    // 9. Upgraded Starfighter Model & Firing & Roll
    const testShip = new Ship(mockScene);
    assert(Boolean(testShip.chinGunPod), 'Ship has underslung chin gun turret pod');
    assert(Array.isArray(testShip.gunBarrels) && testShip.gunBarrels.length === 2, 'Chin gun pod has twin pulse barrels');
    assert(Array.isArray(testShip.crystalEngines) && testShip.crystalEngines.length === 3, 'Ship has rear 3-crystal propulsion array');
    assert(Array.isArray(testShip.floatingFins) && testShip.floatingFins.length === 2, 'Ship has dual floating outrigger canard fins');
    assert(Array.isArray(testShip.engineFlames) && testShip.engineFlames.length === 3, 'Ship has 3 dynamic exhaust flames');

    // Test chin cannon firing origin
    testShip.group.position.set(0, 100, 0);
    testShip.group.quaternion.identity();
    testShip.fireCooldown = 0;
    testShip.fireCannons();
    assert(testShip.projectiles.length === 2, 'fireCannons launches twin pulse cannon bolts');
    const bolt1 = testShip.projectiles[0];
    const bolt2 = testShip.projectiles[1];
    assert(bolt1.mesh.position.y < 102 && bolt1.mesh.position.z < 0, 'Projectiles spawn forward from chin gun pod position');
    assert(Math.abs(bolt1.mesh.position.x - bolt2.mesh.position.x) > 0.15, 'Projectiles spawn from twin separated chin barrels');

    // Test roll input integration
    testShip.landed = false;
    testShip.altitude = 200;
    const initialQuat = testShip.group.quaternion.clone();
    testInput.setVirtualKey('KeyQ', true);
    testShip.updateFlight(0.1, testInput, { dx: 0, dy: 0 }, mockBodies);
    testInput.setVirtualKey('KeyQ', false);
    assert(!testShip.group.quaternion.equals(initialQuat), 'KeyQ induces roll rotation on ship');

    // Test mobile rollRate
    const midQuat = testShip.group.quaternion.clone();
    testInput.rollRate = 1;
    testShip.updateFlight(0.1, testInput, { dx: 0, dy: 0 }, mockBodies);
    testInput.rollRate = 0;
    assert(!testShip.group.quaternion.equals(midQuat), 'Mobile rollRate induces roll rotation on ship');

    // 10. Full Newtonian Orbital Mechanics & Controls Fixes
    // A) Newtonian Inverse-Square Gravity
    const rTest = 720;
    const gDist = evaluateGravity({ x: 0, y: rTest, z: 0 }, mockBodies);
    const expectedG = 26 * Math.pow(360 / rTest, 2);
    assert(Math.abs(Math.abs(gDist.acceleration.y) - expectedG) < 0.05, 'Gravity follows pure Newtonian inverse-square falloff: a = g0*(R/r)^2');
    assert(gDist.mu === 26 * 360 * 360, 'evaluateGravity returns gravitational parameter mu');

    // B) Vacuum Momentum Conservation (zero drag in vacuum)
    const testVacuumShip = new Ship(mockScene);
    testVacuumShip.landed = false;
    testVacuumShip.altitude = 300;
    testVacuumShip.group.position.set(0, 660, 0);
    testVacuumShip.velocity.set(80, 0, 0);
    testVacuumShip.updateFlight(0.1, testInput, { dx: 0, dy: 0 }, mockBodies);
    assert(Math.abs(testVacuumShip.velocity.x - 80) < 0.01, 'Vacuum space has zero artificial drag (momentum conserved)');

    // C) Boost Fix (Holding Shift activates afterburner forward thrust without needing W)
    const testBoostShip = new Ship(mockScene);
    testBoostShip.landed = false;
    testBoostShip.group.position.set(0, 560, 0);
    testBoostShip.altitude = 200;
    testBoostShip.velocity.set(0, 0, 0);
    testInput.setVirtualKey('ShiftLeft', true);
    testBoostShip.updateFlight(0.1, testInput, { dx: 0, dy: 0 }, mockBodies);
    testInput.setVirtualKey('ShiftLeft', false);
    assert(testBoostShip.isBoosting, 'ShiftLeft immediately activates afterburner boost');
    assert(testBoostShip.velocity.length() > 5.0, 'Boost immediately accelerates ship forward without requiring W key');

    // D) SAS Flight Computer Modes (with new TARGET mode)
    assert(testShip.sasMode === 'STABILITY', 'Ship initializes in STABILITY assist mode');
    testShip.cycleSASMode();
    assert(testShip.sasMode === 'PROGRADE', 'cycleSASMode switches to PROGRADE hold');
    testShip.cycleSASMode();
    assert(testShip.sasMode === 'RETROGRADE', 'cycleSASMode switches to RETROGRADE hold');
    testShip.cycleSASMode();
    assert(testShip.sasMode === 'TARGET', 'cycleSASMode switches to TARGET lock (homing nose on target body)');
    testShip.cycleSASMode();
    assert(testShip.sasMode === 'CIRCULARIZE', 'cycleSASMode switches to CIRCULARIZE assist');
    testShip.cycleSASMode();
    assert(testShip.sasMode === 'OFF', 'cycleSASMode switches to OFF (Newtonian Drift)');
    testShip.cycleSASMode();
    assert(testShip.sasMode === 'STABILITY', 'cycleSASMode loops back to STABILITY');

    // E) Keplerian Orbital Telemetry Calculator
    const orbParams = testShip.calculateOrbitParameters(mockBodies[0], {
      mu: 26 * 360 * 360,
      dist: 500,
      altitude: 140
    });
    assert(Boolean(orbParams && orbParams.vCirc > 0), 'calculateOrbitParameters computes circular orbital velocity');
    assert(typeof orbParams.ap !== 'undefined' && typeof orbParams.pe !== 'undefined', 'calculateOrbitParameters computes Ap and Pe');

    // F) Touch Controls 3-Second Idle Auto-Hide
    assert(typeof touchMgr.wakeFromIdle === 'function', 'TouchControlsManager has wakeFromIdle method');
    assert(typeof touchMgr.resetIdleTimer === 'function', 'TouchControlsManager has resetIdleTimer method');
    touchMgr.isIdleFade = true;
    touchOverlay.classList.add('idle-fade');
    touchMgr.wakeFromIdle();
    assert(!touchOverlay.classList.contains('idle-fade'), 'wakeFromIdle removes idle-fade class on touch');

    // 11. Dynamic Keybindings & Jump / Act Responsiveness
    // A) Keybindings schema & labels
    assert(testInput.keybindings.jump.primary === 'Space', 'Default jump binding is Space');
    assert(testInput.keybindings.interact.primary === 'KeyE', 'Default interact binding is KeyE');
    assert(testInput.keybindings.flightBoost.primary === 'ShiftLeft', 'Default flightBoost binding is ShiftLeft');
    assert(testInput.getActionKeyLabel('jump') === 'SPACE', 'getActionKeyLabel returns human-readable label SPACE');
    assert(testInput.getActionKeyLabel('interact') === 'E', 'getActionKeyLabel returns E for interact');

    // B) Dynamic Rebinding & Action Checks
    testInput.rebindAction('jump', 'KeyJ');
    assert(testInput.keybindings.jump.primary === 'KeyJ', 'rebindAction updates jump primary key');
    assert(testInput.getActionKeyLabel('jump') === 'J', 'getActionKeyLabel reflects rebound key J');

    testInput.setVirtualKey('KeyJ', true);
    assert(testInput.isActionDown('jump'), 'isActionDown returns true for newly rebound key');
    assert(testInput.wasActionPressed('jump'), 'wasActionPressed returns true for newly rebound key');
    testInput.endFrame();
    assert(testInput.isActionDown('jump') && !testInput.wasActionPressed('jump'), 'endFrame resets wasActionPressed while keeping isActionDown');
    testInput.setVirtualKey('KeyJ', false);
    assert(!testInput.isActionDown('jump'), 'releasing virtual key unsets isActionDown');

    testInput.resetKeybindings();
    assert(testInput.keybindings.jump.primary === 'Space', 'resetKeybindings restores default Space for jump');

    // C) Explorer Jump & Mid-Air Jetpack Responsiveness with Motion Kinematics
    const jumpExplorer = new Explorer(mockScene);
    jumpExplorer.spawnOnBody(mockBodies[0], new THREE.Vector3(0, 1, 0));
    jumpExplorer.grounded = true;
    testInput.setVirtualKey('Space', true);
    jumpExplorer.update(0.1, testInput, { dx: 0, dy: 0, wheel: 0 }, mockBodies);
    assert(!jumpExplorer.grounded, 'Pressing jump while grounded launches explorer into air');
    assert(jumpExplorer.velocity.y > 5.0, 'Jump gives upward vertical launch velocity');
    assert(jumpExplorer.jumpPhase === 'ascent', 'Jumping explorer enters ascent jump phase');
    assert(jumpExplorer.leftLowerLegGroup.rotation.x < -0.4, 'Jumping explorer flexes knees backward during aerial ascent tuck');
    assert(jumpExplorer.leftForearmGroup.rotation.x > 0.4, 'Jumping explorer articulates elbows for balance during jump');

    // Walking & Sprinting Kinematics (Articulated knees, elbows, torso lean)
    const walkExplorer = new Explorer(mockScene);
    walkExplorer.spawnOnBody(mockBodies[0], new THREE.Vector3(0, 1, 0));
    testInput.setVirtualKey('Space', false);
    testInput.endFrame();
    testInput.setVirtualKey('KeyW', true);
    walkExplorer.update(0.1, testInput, { dx: 0, dy: 0, wheel: 0 }, mockBodies);
    walkExplorer.update(0.1, testInput, { dx: 0, dy: 0, wheel: 0 }, mockBodies);
    assert(walkExplorer.leftLowerLegGroup.rotation.x <= 0, 'Walking explorer articulates knees backward during gait cycle');
    assert(walkExplorer.torso.rotation.x < 0.15, 'Walking explorer maintains upright torso posture');

    // Sprint Kinematics (Forward lean, deep knee flex, 90 deg bent arms)
    testInput.setVirtualKey('ShiftLeft', true);
    testInput.endFrame();
    walkExplorer.update(0.1, testInput, { dx: 0, dy: 0, wheel: 0 }, mockBodies);
    walkExplorer.update(0.1, testInput, { dx: 0, dy: 0, wheel: 0 }, mockBodies);
    assert(walkExplorer.torso.rotation.x >= 0.25, 'Sprinting explorer pitches torso forward into an athletic lean (~20 deg)');
    assert(walkExplorer.leftForearmGroup.rotation.x > 1.0, 'Sprinting explorer pumps 90-degree bent arms');
    testInput.setVirtualKey('KeyW', false);
    testInput.setVirtualKey('ShiftLeft', false);
    testInput.endFrame();

    // Fast Travel Keybinding Support (Numpad1-5 secondary keys)
    assert(DEFAULT_KEYBINDINGS.quickRepair.secondary === 'Numpad1', 'quickRepair keybinding supports Numpad1');
    assert(DEFAULT_KEYBINDINGS.quickOrbit.secondary === 'Numpad2', 'quickOrbit keybinding supports Numpad2');
    assert(DEFAULT_KEYBINDINGS.quickMoon1.secondary === 'Numpad3', 'quickMoon1 keybinding supports Numpad3');
    assert(DEFAULT_KEYBINDINGS.quickMoon2.secondary === 'Numpad4', 'quickMoon2 keybinding supports Numpad4');
    assert(DEFAULT_KEYBINDINGS.quickMoon3.secondary === 'Numpad5', 'quickMoon3 keybinding supports Numpad5');

    // Mid-air jetpack boost
    testInput.setVirtualKey('Space', true);
    const preBoostFuel = jumpExplorer.jetpackFuel;
    jumpExplorer.update(0.1, testInput, { dx: 0, dy: 0, wheel: 0 }, mockBodies);
    assert(jumpExplorer.jetpackFuel < preBoostFuel, 'Holding jump in mid-air activates jetpack and consumes fuel');
    assert(jumpExplorer.jetFlameLeft.visible, 'Jetpack flame cones are visible during jetpack propulsion');
    testInput.setVirtualKey('Space', false);
    testInput.endFrame();

    // D) ACT / Interact & Disembark Checks
    testInput.rebindAction('interact', 'KeyF');
    testInput.setVirtualKey('KeyF', true);
    assert(testInput.wasActionPressed('interact'), 'Dynamic interact action triggers on rebound KeyF');
    testInput.setVirtualKey('KeyF', false);
    testInput.resetKeybindings();

    // 12. UI Scale & Display Ratio Settings
    const settingsMgr = new SettingsManager(() => {}, touchMgr, testInput);
    assert(typeof settingsMgr.calculateOptimalScale === 'function', 'SettingsManager provides calculateOptimalScale');
    assert(typeof settingsMgr.applyUIScale === 'function', 'SettingsManager provides applyUIScale');

    // Clamping & CSS variable setting
    settingsMgr.applyUIScale(0.85);
    assert(Math.abs(settingsMgr.uiScale - 0.85) < 1e-3, 'applyUIScale sets uiScale to 0.85');
    assert(document.documentElement.style.getPropertyValue('--ui-scale') === '0.85', 'applyUIScale updates document --ui-scale property');
    assert(Math.abs(touchMgr.maxStickRadius - (45 * 0.85)) < 1e-3, 'TouchControls maxStickRadius scales with UI scale');

    // Upper and lower limit clamping [0.65, 1.40]
    settingsMgr.applyUIScale(2.50);
    assert(Math.abs(settingsMgr.uiScale - 1.40) < 1e-3, 'applyUIScale clamps overly large scales to 1.40 max');
    settingsMgr.applyUIScale(0.20);
    assert(Math.abs(settingsMgr.uiScale - 0.65) < 1e-3, 'applyUIScale clamps overly small scales to 0.65 min');

    // Optimal scale calculation produces reasonable scale
    const calcScale = settingsMgr.calculateOptimalScale();
    assert(calcScale >= 0.70 && calcScale <= 1.20, 'calculateOptimalScale returns sane scale within [0.70, 1.20]');

    // Reset back to standard 1.0
    settingsMgr.applyUIScale(1.0, false);
    assert(document.documentElement.style.getPropertyValue('--ui-scale') === '1.00', 'applyUIScale can reset to 1.00');

    // 13. Procedural Geometry & Branching Curves (procGeo.js)
    const rng = mulberry32(777);
    const rVal1 = rng();
    const rVal2 = rng();
    assert(rVal1 >= 0 && rVal1 <= 1 && rVal2 >= 0 && rVal2 <= 1, 'mulberry32 returns valid normalized floats [0, 1]');

    const spine = bezierSpine(rng, 10, 0.35, 6);
    assert(spine.points.length === 7, 'bezierSpine creates correct sample count');
    assert(Math.abs(spine.tip.y - 10) < 1e-3, 'bezierSpine reaches designated height');
    assert(Math.abs(spine.points[0].x) < 1e-4 && Math.abs(spine.points[0].z) < 1e-4, 'bezierSpine starts at base origin');

    const tubeGeo = tubeAlongSpine(spine, (t) => 1.0 - t * 0.5, 6);

        if (c.count > 0) goliathHasMycena = true;
      } else if (c.material === goliathMoon.decor.arborMat?.trunk || c.material === goliathMoon.decor.fernMat || c.material === goliathMoon.decor.cactusMat?.body) {
        if (c.count > 0) goliathHasOther = true;
      }
    });
    assert(goliathHasMycena === true, 'Moon III (Goliath) populates Aurelian Lucent-Mycena titan neon fungi');
    assert(goliathHasOther === false, 'Moon III (Goliath) strictly excludes non-native flora species');

    // 27C: Aurelia Prime Planetary Biome Zoning & Flora Collision
    let planetHasPalms = false;
    let planetHasFerns = false;
    let planetHasMycena = false;
    let planetHasTendril = false;
    let planetHasCactus = false;

    system.planet.decor.group.children.forEach(c => {
      if (c.material === system.planet.decor.arborMat.trunk && c.count > 0) planetHasPalms = true;
      if (c.material === system.planet.decor.fernMat && c.count > 0) planetHasFerns = true;
      if (c.material === system.planet.decor.mycenaMat.trunk && c.count > 0) planetHasMycena = true;
      if (c.material === system.planet.decor.tendrilMat.foliage && c.count > 0) planetHasTendril = true;
      if (c.material === system.planet.decor.cactusMat.body && c.count > 0) planetHasCactus = true;
    });

    assert(planetHasPalms === true, 'Aurelia Prime populates Cobalt Strata-Arbor palms in coastal/steppe biomes');
    assert(planetHasFerns === true, 'Aurelia Prime populates Cyan Serrata-Ferns in temperate steppe grasslands');
    assert(planetHasMycena === true, 'Aurelia Prime populates Aurelian Lucent-Mycena in conifer forest valleys');
    assert(planetHasTendril === true, 'Aurelia Prime populates Abyssal Tendril-Pods in forest undergrowth');
    assert(planetHasCactus === true, 'Aurelia Prime populates Prismatic Lithocactus on granite highland peaks');

    // Flora Collision Grid Registration
    assert(system.planet.floraCollisionGrid.colliders.length > 50, 'Aurelia Prime registers colliders for solid flora trunks');
    const mycenaCollider = system.planet.floraCollisionGrid.colliders.find(c => c.type === 'mushroom');
    const palmCollider = system.planet.floraCollisionGrid.colliders.find(c => c.type === 'palm');
    const cactusCollider = system.planet.floraCollisionGrid.colliders.find(c => c.type === 'crystal');
    assert(Boolean(mycenaCollider && palmCollider && cactusCollider), 'FloraCollisionGrid registers distinct collider types for mushroom, palm, and cactus');

    const summary = `SUMMARY: ${passed} passed, ${failed} failed`;
    logs.push('', summary);
    document.getElementById('test-output').textContent = logs.join('\n');
    document.title = failed === 0 ? `TESTS_PASSED (${passed})` : `TESTS_FAILED (${failed})`;
  </script>
</body>
